[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = common documents knowledge analysis exports projects

markers =
    llm: 실제 LLM API를 호출하는 테스트 (비용 발생)
    db: DB 연결이 필요한 테스트

# llm 마커를 기본 제외한다 — 실수로 비용이 발생하는 것을 막고 키 없이 돌게 한다.
addopts = -m "not llm" --strict-markers

# pytest-env 플러그인 기능. 이 섹션이 동작하지 않으면 pytest-env 가 없는 것이다.
env =
    LLM_FAKE=True
    DJANGO_DEBUG=True
